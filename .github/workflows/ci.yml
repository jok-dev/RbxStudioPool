name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: ok-nick/setup-aftman@v0.4.2
        with:
          path: spikes/place
      - run: lune run spikes/place/lune/tests/relay.test.luau
      - run: lune run spikes/place/lune/tests/diff.test.luau
      - run: lune run spikes/place/lune/tests/merge.test.luau
